---
name: PR

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          echo "PYTHON_VERSION=$(cat .python-version)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: |
          echo "PYTHON_VERSION=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_ENV"
      - name: Install npm deps
        run: npm install

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: 2.1.2
          virtualenvs-create: true
          virtualenvs-in-project: false
          virtualenvs-path: ~/.virtualenvs

      - name: Cache Poetry virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-virtualenv
        with:
          path: ~/.virtualenvs
          key: ${{ runner.os }}-${{ env.PYTHON_VERSION }}-virtualenvs-${{ hashFiles('poetry.lock') }}
      - name: Install virtual environment
        if: steps.cache-virtualenv.outputs.cache-hit != 'true'
        run: poetry install
      - name: Lint Python
        run: make lint-python

  test:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "PYTHON_VERSION=$(cat .python-version)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: |
          echo "PYTHON_VERSION=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_ENV"
      - name: Install npm deps
        run: npm install
      - name: Running ajv tests
        run: make test-ajv

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: 2.1.2
          virtualenvs-create: true
          virtualenvs-in-project: false
          virtualenvs-path: ~/.virtualenvs

      - name: Cache Poetry virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-virtualenv
        with:
          path: ~/.virtualenvs
          key: ${{ runner.os }}-${{ env.PYTHON_VERSION }}-virtualenvs-${{ hashFiles('poetry.lock') }}
      - name: Install virtual environment
        if: steps.cache-virtualenv.outputs.cache-hit != 'true'
        run: poetry install
      - name: Running Python tests
        run: make test-python

  docker-push-and-check:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag
        run: |
          # Convert repository to lowercase for Docker tags
          REGISTRY_IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY_IMAGE=${REGISTRY_IMAGE}" >> "$GITHUB_ENV"

          # On PR, use branch name; on push to main, use 'latest'
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            TAG="${HEAD_REF//[^a-zA-Z0-9_-]/-}"
          else
            TAG="latest"
          fi

          echo "TAG=${TAG}" >> "$GITHUB_ENV"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Python Validator Image
        run: docker build -t "${REGISTRY_IMAGE}:${TAG}" -f Dockerfile .

      - name: Push Python Validator Image
        run: |
          echo "Pushing to GHCR with tag ${TAG}"
          docker push "${REGISTRY_IMAGE}:${TAG}"

      - name: Build AJV Validator Image
        run: |
          docker build -t "${REGISTRY_IMAGE}-ajv:${TAG}" -f Dockerfile-ajv .

      - name: Push AJV Validator Image
        run: |
          echo "Pushing to GHCR with tag ${TAG}"
          docker push "${REGISTRY_IMAGE}-ajv:${TAG}"

      - name: Create Validator Network
        run: docker network create validator-network

      - name: Spin Up AJV Validator
        run: |
          docker run --network validator-network --name ajv-validator -d -p 5002:5002 "${REGISTRY_IMAGE}-ajv:${TAG}"
      - name: Spin Up Python Validator
        run: >
          docker run
          --network validator-network --name eq-questionnaire-validator -d -p 5001:5000 -e AJV_VALIDATOR_HOST=ajv-validator "${REGISTRY_IMAGE}:${TAG}"
      - name: Check Python Validator is Running
        run: |
          for i in {1..10}; do
            if curl -f http://localhost:5001/status; then
              echo "Python Validator is up!"
              exit 0
            fi
            echo "Waiting for Python Validator... ($i/10)"
            sleep 3
          done
          echo "Python Validator did not start in time"
          docker logs eq-questionnaire-validator
          exit 1
      - name: Check AJV Validator is Running
        run: |
          for i in {1..10}; do
            if curl -f http://localhost:5002/status; then
              echo "AJV Validator is up!"
              exit 0
            fi
            echo "Waiting for AJV Validator... ($i/10)"
            sleep 3
          done
          echo "AJV Validator did not start in time"
          docker logs ajv-validator
          exit 1
      - name: Check Valid Schema Validation
        run: |
          schema_url="https://raw.githubusercontent.com/ONSdigital/eq-questionnaire-validator/refs/heads/main/tests/schemas/valid/test_checkbox_instruction.json"
          result=$(curl -s "http://localhost:5001/validate?url=$schema_url")
          echo "Validation result: $result"
          if [ "$result" = '{"validator_version":"0.0.0","success":true}' ]; then
            echo "Validation successful, returned JSON as expected!"
            exit 0
          fi
          echo "Unexpected validation error, did not return correct JSON. Actual result: $result"
          exit 1
      - name: Check Invalid Schema Validation
        run: |
          schema_url="https://raw.githubusercontent.com/ONSdigital/eq-questionnaire-validator/refs/heads/main/tests/schemas/invalid/test_invalid_introduction_block.json"
          result=$(curl -s "http://localhost:5001/validate?url=$schema_url")
          echo "Validation result: $result"
          if [[ "$result" == *"errors"* ]]; then
          echo "Validation returned JSON as expected!"
          exit 0
          fi
          echo "Validation did not return correct JSON. Actual result: $result"
          exit 1
